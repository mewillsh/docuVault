[project]
name = "docuvault"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mewillsh", email = "harshsingh22082003@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "cloudinary>=1.46.2",
    "fastapi>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.47",
    "uvicorn>=0.54.0",
]

[project.scripts]
docuvault = "docuvault:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
